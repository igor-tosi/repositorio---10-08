<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarefas</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="aplicacao">
      <section class="cartao">
        <h1>Minhas tarefas</h1>

        <form id="formulario-tarefa" class="formulario-tarefa">
          <input type="hidden" id="id-tarefa" />

          <div class="campo">
            <label for="titulo-tarefa">Título</label>
            <input id="titulo-tarefa" name="titulo-tarefa" type="text" placeholder="Ex.: Estudar Node.js" required />
          </div>

          <div class="campo">
            <label for="descricao-tarefa">Descrição</label>
            <textarea id="descricao-tarefa" name="descricao-tarefa" rows="3" placeholder="Detalhes da tarefa"></textarea>
          </div>

          <div class="acoes">
            <button type="submit" id="botao-enviar">Adicionar tarefa</button>
            <button type="button" id="botao-cancelar" class="botao-secundario escondido">Cancelar</button>
          </div>
        </form>

        <p id="mensagem-status" class="mensagem-status" aria-live="polite"></p>
      </section>

      <section class="lista-tarefas-container">
        <div class="cabecalho-lista">
          <h2>Tarefas</h2>
          <span id="contador-tarefas">0 itens</span>
        </div>

        <ul id="lista-tarefas" class="lista-tarefas"></ul>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
